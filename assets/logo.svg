  <ellipse cx="64" cy="56" rx="30" ry="24" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="64" cy="56" rx="18" ry="14" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.5"/>
  <!-- Pivot node -->
  <circle cx="64" cy="56" r="6" fill="url(#accent)"/>
  <circle cx="64" cy="56" r="2.5" fill="#0d1117"/>
  <!-- Forward arrow -->
  <path d="M42 96 L78 96" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M76 90 L86 96 L76 102" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
